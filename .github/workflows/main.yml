
name: Polineo Kasta Sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-prom-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check Prom XML feed
        env:
          PROM_FEED_URL: ${{ secrets.PROM_FEED_URL }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import xml.etree.ElementTree as ET

          url = os.environ.get("PROM_FEED_URL", "")
          if not url.startswith("https://"):
              raise SystemExit("PROM_FEED_URL is missing or invalid")

          try:
              request = urllib.request.Request(
                  url, headers={"User-Agent": "PolineoFeedCheck/1.0"}
              )
              with urllib.request.urlopen(request, timeout=90) as response:
                  data = response.read()

              root = ET.fromstring(data)
              offers = root.findall(".//offer")

              if not offers:
                  raise ValueError("No offer elements found")

              available = sum(
                  x.get("available", "").lower() == "true"
                  for x in offers
              )

              print("XML downloaded successfully")
              print("Total offers:", len(offers))
              print("Available:", available)
              print("Other availability:", len(offers) - available)
              print("No changes made to Kasta or GitHub XML")
          except Exception:
              raise SystemExit("Feed verification failed")
          PY
