
name: Polineo Kasta Sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test XML
        env:
          PROM_FEED_URL: ${{ secrets.PROM_FEED_URL }}
        run: |
          python - <<'PY'
          import os
          import glob
          import urllib.request
          import xml.etree.ElementTree as ET
          from decimal import Decimal, ROUND_HALF_UP

          url = os.environ.get("PROM_FEED_URL", "")
          if not url.startswith("https://"):
              raise SystemExit("Missing PROM_FEED_URL")

          files = glob.glob("polineo_kasta_edynyi_katalog_*.xml")
          if len(files) != 1:
              raise SystemExit("Expected one Kasta XML file")

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "PolineoSync/1.0"}
          )
          with urllib.request.urlopen(req, timeout=120) as r:
              prom_root = ET.fromstring(r.read())

          tree = ET.parse(files[0])
          kasta_root = tree.getroot()

          prom = {
              o.get("id"): o
              for o in prom_root.findall(".//offer")
              if o.get("id")
          }
          kasta = kasta_root.findall(".//offer")
          existing = {o.get("id") for o in kasta}

          overrides = {
              "754311885": Decimal("3771"),
              "3083334722": Decimal("1850"),
          }

          updated = 0
          unavailable = 0
          prices_updated = 0
          missing_price = 0

          for offer in kasta:
              pid = offer.get("id")
              source = prom.get(pid)
              available = (
                  source is not None
                  and source.get("available", "").lower() == "true"
              )

              offer.set("available", "true" if available else "false")
              stock = offer.find("stock_quantity")
              if stock is None:
                  stock = ET.SubElement(offer, "stock_quantity")
              stock.text = "50" if available else "0"

              if not available:
                  unavailable += 1

              if source is not None:
                  raw_price = source.findtext("price")
                  try:
                      base = overrides.get(pid)
                      if base is None:
                          base = Decimal(raw_price.replace(",", "."))
                      if not base.is_finite() or base <= 0:
                          raise ValueError("Invalid price")

                      price = (base * Decimal("1.255")).quantize(
                          Decimal("0.01"), rounding=ROUND_HALF_UP
                      )
                      target = offer.find("price")
                      if target is None:
                          target = ET.SubElement(offer, "price")
                      target.text = str(price)
                      prices_updated += 1
                  except (ValueError, TypeError, AttributeError):
                      missing_price += 1

              updated += 1

          new_ids = sorted(set(prom) - existing)
          missing_ids = sorted(existing - set(prom))

          tree.write(
              "polineo_TEST.xml",
              encoding="utf-8",
              xml_declaration=True
          )

          ET.parse("polineo_TEST.xml")

          print("Prom offers:", len(prom))
          print("Kasta XML offers:", updated)
          print("Updated prices:", prices_updated)
          print("Invalid or missing prices:", missing_price)
          print("Stock 50:", updated - unavailable)
          print("Stock 0:", unavailable)
          print("New IDs requiring import:", len(new_ids))
          print("IDs missing from Prom:", len(missing_ids))
          print("New IDs:", ", ".join(new_ids[:20]))
          print("Missing IDs:", ", ".join(missing_ids[:20]))
          print("TEST ONLY. Production XML unchanged.")
          PY

      - name: Upload test XML
        uses: actions/upload-artifact@v4
        with:
          name: Polineo-TEST-XML
          path: polineo_TEST.xml
          retention-days: 7
